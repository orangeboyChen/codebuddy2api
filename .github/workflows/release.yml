name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_CACHE_PATH: ~/.bun/install/cache
  BUN_VERSION: 1.3.14
  CI: true
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  create-version-pr:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Prepare version branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          IFS='.' read -r major minor patch <<< "$current_version"
          case "${{ inputs.version_bump }}" in
            major)
              version="$((major + 1)).0.0"
              ;;
            minor)
              version="${major}.$((minor + 1)).0"
              ;;
            patch)
              version="${major}.${minor}.$((patch + 1))"
              ;;
            *)
              echo 'Unsupported version increment.' >&2
              exit 1
              ;;
          esac
          branch="release/v${version}"
          node -e "const fs=require('fs'); const p='package.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.version=process.argv[1]; fs.writeFileSync(p,JSON.stringify(x,null,2)+'\\n')" "$version"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "chore: prepare release v${version}"
          git push --set-upstream origin "$branch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then exit 0; fi
          gh pr create --base main --head "$BRANCH" --label release --title "chore: prepare release v${VERSION}" --body "Automated version bump for release v${VERSION}. Merge this PR to trigger the release workflow."

  detect-release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      image: ghcr.io/${{ steps.owner.outputs.owner }}/codebuddy2api
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release_pr="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[] | select(.base.ref == "main" and (.title | startswith("chore: prepare release v")) and (.head.ref | startswith("release/v"))) | .number' | head -n 1 || true)"
          if [[ -z "$release_pr" ]]; then
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo 'should_release=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
      - id: owner
        run: echo "owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  verify:
    needs: detect-release
    if: ${{ needs.detect-release.outputs.should_release == 'true' }}
    name: Verify Bun / TypeScript / Coverage
    runs-on: ubuntu-latest
    env:
      # Typechecking the Electron main process needs the package's types, not
      # the ~100 MB binary. The desktop jobs below download it for real.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ${{ env.BUN_CACHE_PATH }}
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:coverage
  publish-image:
    needs: [detect-release, verify]
    if: ${{ needs.detect-release.outputs.should_release == 'true' }}
    name: Publish ${{ matrix.arch }} image
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runs_on: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runs_on: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        env:
          IMAGE: ${{ needs.detect-release.outputs.image }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${IMAGE}:${VERSION}-${{ matrix.arch }}" "${IMAGE}:latest-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  build-desktop:
    needs: [detect-release, verify]
    if: ${{ needs.detect-release.outputs.should_release == 'true' }}
    name: Desktop ${{ matrix.label }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    # Notarization, and the private git repository `match` keeps the Developer
    # ID certificate in. Empty when the repository has none: the build then
    # stays unsigned, as it is today. Scoped to the macOS entries on purpose —
    # Apple credentials mean nothing to the Windows and Linux installers.
    env:
      APPLE_API_ISSUER: ${{ matrix.macos && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY: ${{ matrix.macos && secrets.APPLE_API_KEY || '' }}
      APPLE_API_KEY_ID: ${{ matrix.macos && secrets.APPLE_API_KEY_ID || '' }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ matrix.macos && secrets.MATCH_GIT_BASIC_AUTHORIZATION || '' }}
      MATCH_GIT_PRIVATE_KEY: ${{ matrix.macos && secrets.MATCH_GIT_PRIVATE_KEY || '' }}
      MATCH_GIT_URL: ${{ matrix.macos && secrets.MATCH_GIT_URL || '' }}
      MATCH_KEYCHAIN_PASSWORD: ${{ matrix.macos && secrets.MATCH_KEYCHAIN_PASSWORD || '' }}
      MATCH_PASSWORD: ${{ matrix.macos && secrets.MATCH_PASSWORD || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per architecture: the gateway's native module is
          # compiled against Electron on the build machine, so an x86 Mac has
          # to be built on an x86 Mac.
          - {
              label: macos-arm64,
              runs_on: macos-latest,
              targets: '--mac --arm64',
              macos: true,
            }
          - {
              label: macos-x64,
              runs_on: macos-15-intel,
              targets: '--mac --x64',
              macos: true,
            }
          - {
              label: windows-x64,
              runs_on: windows-latest,
              targets: '--win --x64',
            }
          - {
              label: linux-x64,
              runs_on: ubuntu-latest,
              targets: '--linux --x64',
            }
          - {
              label: linux-arm64,
              runs_on: ubuntu-24.04-arm,
              targets: '--linux --arm64',
            }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ${{ env.BUN_CACHE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build
      # `match` is Ruby, and it is the only reason this repository has any.
      - uses: ruby/setup-ruby@v1
        if: ${{ matrix.macos }}
        with:
          bundler-cache: true
          ruby-version: '3.3'
      - name: Trust github.com for the certificate repository
        if: ${{ env.MATCH_GIT_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          # `git clone` over ssh refuses a host it has never seen, and a runner
          # has never seen github.com.
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Give notarytool its API key
        if: ${{ env.APPLE_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # `notarytool --key` takes a path to the .p8 and not the key itself,
          # so the secret has to become a file before electron-builder runs.
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build desktop app
        shell: bash
        run: |
          set -euo pipefail
          # Only macOS goes through fastlane: it is the one platform with a
          # certificate to import, and the lane builds the same app — unsigned —
          # when there is none.
          if [[ "${{ matrix.macos }}" == "true" ]]; then
            bundle exec fastlane mac targets:"${{ matrix.targets }}"
          else
            bun scripts/build-desktop.ts ${{ matrix.targets }}
          fi
      - name: Check that the app is signed
        if: ${{ env.MATCH_GIT_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          app="$(find build/desktop -name '*.app' -maxdepth 2 -print -quit)"
          if [[ -z "$app" ]]; then
            echo '::error::electron-builder left no .app behind'
            exit 1
          fi
          # A build that quietly skipped signing looks exactly like one that
          # worked, right up to the Mac that refuses to open the dmg.
          codesign -dv --verbose=4 "$app" 2>&1 | tee codesign.log
          if grep -q 'TeamIdentifier=not set' codesign.log; then
            echo "::error::$app carries no signing identity — check MATCH_GIT_URL, MATCH_PASSWORD and MATCH_KEYCHAIN_PASSWORD"
            exit 1
          fi
          # Signed but not notarized opens on no Mac either: Gatekeeper asks
          # Apple about the app, and there is nothing on file for it.
          if [[ -z "$APPLE_API_KEY" ]]; then
            echo '::warning::The app is signed but was never notarized — APPLE_API_KEY, APPLE_API_KEY_ID or APPLE_API_ISSUER is missing'
          fi
      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: desktop-${{ matrix.label }}
          path: |
            build/desktop/*.dmg
            build/desktop/*.exe
            build/desktop/*.AppImage
            build/desktop/*.deb

  merge-image-manifests:
    needs: [detect-release, publish-image]
    if: ${{ needs.detect-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          IMAGE: ${{ needs.detect-release.outputs.image }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"

  release:
    needs: [detect-release, merge-image-manifests, build-desktop]
    if: ${{ needs.detect-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: build/desktop
          pattern: desktop-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-release.outputs.release_tag }}
          IMAGE: ${{ needs.detect-release.outputs.image }}:${{ needs.detect-release.outputs.version }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --sort=-v:refname | grep '^v' | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            commits="$(git log --pretty=format:'- %h %s' "${previous_tag}..${GITHUB_SHA}")"
          else
            commits="$(git log --pretty=format:'- %h %s' "${GITHUB_SHA}")"
          fi
          notes_file="$(mktemp)"
          {
            echo "Docker image: \`$IMAGE\`"
            echo
            echo '## Desktop apps'
            echo
            echo 'Builds of the Electron app, one per platform:'
            echo
            echo '- macOS: `CodeBuddy2API-<version>-mac-<arch>.dmg` (Apple silicon and Intel)'
            echo '- Windows: `CodeBuddy2API-<version>-win-x64-setup.exe` and `-portable.exe`'
            echo '- Linux: `CodeBuddy2API-<version>-linux-<arch>.AppImage` and `codebuddy2api-<version>-linux-<arch>.deb`'
            echo
            echo 'On Windows, dismiss the SmartScreen prompt with Run anyway. If macOS says the app is damaged and cannot be opened, drag it into `Applications` and run:'
            echo
            echo '```sh'
            echo 'xattr -cr /Applications/CodeBuddy2API.app'
            echo '```'
            echo
            echo '## Commits'
            echo
            if [[ -n "$commits" ]]; then
              printf '%s\n' "$commits"
            else
              echo '- No commits found.'
            fi
          } > "$notes_file"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --latest --notes-file "$notes_file"
      - name: Attach desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-release.outputs.release_tag }}
        run: gh release upload "$TAG" build/desktop/* --clobber
