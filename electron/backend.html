<!doctype html>
<!--
  The window that asks which backend to use, and which port to serve on, shown
  on a first launch and from the menu bar item — and, when the deployment the
  user named does not answer or the port the app was given is already taken, the
  window that says so.

  It is a bundled page: `scripts/build-desktop.ts` compiles `backend.tsx` into
  the `backend.js` sitting next to this file, so React is on disk and nothing is
  fetched. The window only ever talks to the main process, through the preload
  bridge.

  Its styling is plain CSS in the block below, and the controls are the browser's
  own — a real radio button, a real text field, accent-coloured the way the
  system does it. The window is a dialog of this computer, not a page of the
  console, so it is dressed like the computer and not like the console.

  The stylesheet has to live here: the page is loaded from `file://` under a
  content security policy with no `style-src` beyond `'unsafe-inline'`, so a
  separate `.css` next to this file would never be fetched.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `script-src 'self'` covers `backend.js` next to this file: a page loaded
      from `file://` has no other origin to name, and `'unsafe-inline'` is what
      this stylesheet is.
    -->
    <meta
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; form-action 'none'"
      http-equiv="Content-Security-Policy"
    />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>CodeBuddy2API</title>
    <style>
      /*
        The window asks in one language and answers in another, and the same
        question takes a different amount of room in each — so nothing here is
        fixed at a width the text has to fit into. `#pane` is measured and the
        window is sized to it; see `useFitWindow` in `backend.tsx`.
      */
      /*
        The window is a dialog of this computer, so the computer dresses it:
        every colour below is one the system answers with — the window
        background, the text on it, the fields, the buttons, the accent — and
        `color-scheme` is what lets them follow the appearance setting, light on
        a light desktop and dark on a dark one. Nothing here is a colour this
        app picked.
      */
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        /* The pane is measured to size the window, and a scrollbar appearing
           under a pane that is briefly larger than the window would change the
           measurement — so nothing here scrolls. */
        overflow: hidden;
      }

      body {
        background: Canvas;
        color: CanvasText;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      /*
        The pane the window is sized to: `max-content` is its own preferred
        width — what the text wants, rather than what is left over in a window
        that has not been sized yet — capped so a long hint wraps instead of
        stretching the window across the screen, and floored so a short question
        does not come out as a sliver.
      */
      #pane {
        max-width: 480px;
        min-width: 360px;
        padding: 20px 22px;
        width: max-content;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin: 0;
      }

      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        text-align: center;
      }

      .options {
        border: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding: 0;
      }

      /* The whole row answers the click, not just the radio's own dot. */
      .option {
        align-items: start;
        cursor: pointer;
        display: grid;
        gap: 8px;
        grid-template-columns: auto 1fr;
      }

      .option input {
        /* The accent the user picked for the whole computer, not for this app. */
        accent-color: AccentColor;
        height: 13px;
        margin: 2px 0 0;
        width: 13px;
      }

      .option strong {
        font-weight: 600;
      }

      .hint {
        color: GrayText;
        display: block;
        font-size: 12px;
        font-weight: 400;
      }

      /*
        antd draws these radios, and its group drops the font size to nothing to
        close the gap between the rows — so the label is given one back here, or
        it renders at zero and there is no title to read. `align-items: start`
        is for the option that has a hint under it: two lines of label belong
        against the top of the dot, not centred on it.
      */
      .options .ant-radio-wrapper {
        align-items: start;
        font-size: 13px;
      }

      .options strong {
        font-weight: 600;
      }

      /*
        A field and what belongs to it: the address of a deployment and the port
        the app serves on are asked the same way — the browser's own text field,
        with the label above it and what it is for underneath.
      */
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field label {
        font-weight: 600;
      }

      .field input {
        background: Field;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        color: FieldText;
        font: inherit;
        padding: 5px 8px;
        width: 100%;
      }

      .field input:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 1px;
      }

      /* Dimmed with the choice it belongs to: only a deployment has an address. */
      .field input:disabled {
        opacity: 0.5;
      }

      .message {
        color: GrayText;
        margin: 0;
      }

      .error {
        /* Red enough to read on either appearance: no system colour says "wrong". */
        color: light-dark(#b3261e, #ff8a80);
        font-size: 12px;
        margin: 0;
      }

      .buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      button {
        background: ButtonFace;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        color: ButtonText;
        font: inherit;
        min-width: 78px;
        padding: 4px 14px;
      }

      /* Pressed towards the text colour, so a hover reads on either appearance. */
      button:hover {
        background: color-mix(in srgb, ButtonText 12%, ButtonFace);
      }

      /* Asked and being answered: "Try again" while the app is trying again. */
      button:disabled {
        opacity: 0.5;
      }

      button:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 1px;
      }

      /* The system's own accent, and the button Enter presses. */
      button.primary {
        background: AccentColor;
        border-color: transparent;
        color: AccentColorText;
      }

      button.primary:hover {
        background: color-mix(in srgb, ButtonText 15%, AccentColor);
      }

      /*
        Pressed and being answered: a ring the computer turns on its own, so a
        button waiting on a browser says it is still going rather than simply
        refusing to be pressed.
      */
      .spinner {
        animation: spin 700ms linear infinite;
        border: 2px solid currentColor;
        border-radius: 50%;
        border-top-color: transparent;
        display: inline-block;
        height: 11px;
        margin-right: 6px;
        vertical-align: -1px;
        width: 11px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="backend.js"></script>
  </body>
</html>
