<!doctype html>
<!--
  The window that asks which backend to use, shown on a first launch and from
  the menu bar item — and, when the deployment the user named does not answer,
  the window that says so.

  It is a bundled page: `scripts/build-desktop.ts` compiles `backend.tsx` into
  the `backend.js` sitting next to this file, so React and @lobehub/ui are on
  disk and nothing is fetched. The window only ever talks to the main process,
  through the preload bridge.
-->
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `script-src 'self'` covers `backend.js` next to this file: a page loaded
      from `file://` has no other origin to name, and `'unsafe-inline'` is what
      the bundled CSS-in-JS needs to insert its own style elements.
    -->
    <meta
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; form-action 'none'"
      http-equiv="Content-Security-Policy"
    />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>CodeBuddy2API</title>
    <style>
      /*
        The `dark` class is what the console's own theme provider reads, so the
        window lands on the console's dark theme; the background is here so it
        is dark in the moment before React paints.
      */
      :root {
        color-scheme: dark;
      }

      body {
        background: #111318;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="backend.js"></script>
  </body>
</html>
